name: AccurateStats Windows x64 EXE

on:
  push:
    branches:
      - fix/windows-foreground-reading-stats
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accurate-stats-windows-x64
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set up bundled vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Test reading statistics
        env:
          # Harmless local test values; the tests never contact Supabase.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: local-test-anon-key
        run: pnpm --filter @readest/readest-app exec vitest run src/__tests__/statistics/ReadingStatsTracker.test.tsx src/__tests__/statistics/trackerCore.test.ts

      - name: Type check and lint
        run: pnpm --filter @readest/readest-app lint

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          key: accurate-stats-windows-x64

      - name: Build Windows executable
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # Baked into this personal binary so it never replaces itself with upstream Readest.
          READEST_DISABLE_UPDATER: '1'
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.personal-build.conf.json

      - name: Stage shared-data standalone EXE
        shell: pwsh
        run: |
          $version = (Get-Content apps/readest-app/package.json | ConvertFrom-Json).version
          $name = "Readest_AccurateStats_${version}_x64.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/readest.exe" $name
          "ACCURATE_STATS_EXE=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: Readest-AccurateStats-Windows-x64
          path: ${{ env.ACCURATE_STATS_EXE }}
          if-no-files-found: error
          retention-days: 14
