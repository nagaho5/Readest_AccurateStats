name: AccurateStats Windows x64

on:
  push:
    branches:
      - fix/windows-foreground-reading-stats
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set up bundled vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Test reading statistics
        run: pnpm --filter @readest/readest-app exec vitest run src/__tests__/statistics/ReadingStatsTracker.test.tsx src/__tests__/statistics/trackerCore.test.ts

      - name: Type check and lint
        run: pnpm --filter @readest/readest-app lint

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          key: accurate-stats-windows-x64

      - name: Build Windows installer (no upstream updater/signing)
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.personal-build.conf.json

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Readest-AccurateStats-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
